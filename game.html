
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Анкета</title>
</head>
<body>

<h1>Анкета геймера</h1>
<p>Заповни анкету та розкажи про свої ігрові вподобання.</p>

<form action="#" method="post">

    <fieldset>
        <legend>Інформація про гравця</legend>

        <label for="nickname">Нікнейм:</label>
        <input type="text" id="nickname" name="nickname"
               placeholder="Введіть нікнейм" required>
        <br><br>

        <label for="email">Електронна пошта:</label>
        <input type="email" id="email" name="email"
               placeholder="example@gmail.com"
               autocomplete="off" required>
        <br><br>

        <label for="phone">Телефон:</label>
        <input type="tel" id="phone" name="phone"
               placeholder="+380XXXXXXXXX"
               pattern="\+380[0-9]{9}">
        <br><br>

        <label for="website">Посилання на профіль:</label>
        <input type="url" id="website" name="website"
               placeholder="https://example.com">
        <br><br>

        <label for="age">Вік:</label>
        <input type="number" id="age" name="age"
               min="7" max="100" placeholder="Ваш вік" required>
        <br><br>

        <label for="code">Код гравця:</label>
        <input type="text" id="code" name="code"
               placeholder="GM1234"
               pattern="[A-Z]{2}[0-9]{4}"
               title="Дві великі літери та чотири цифри">
    </fieldset>

    <br>

    <fieldset>
        <legend>Ігрові вподобання</legend>

        <label for="game">Улюблена гра:</label>
        <input type="text" id="game" name="game"
               list="games" placeholder="Оберіть гру">

        <datalist id="games">
            <option value="Counter-Strike 2">
            <option value="Minecraft">
            <option value="Dota 2">
            <option value="GTA V">
            <option value="Valorant">
        </datalist>
        <br><br>

        <label for="platform">Платформа:</label>
        <select id="platform" name="platform">
            <option value="pc">Комп'ютер</option>
            <option value="playstation">PlayStation</option>
            <option value="xbox">Xbox</option>
            <option value="mobile">Смартфон</option>
        </select>
        <br><br>

        <label for="hours">Годин гри на день:</label>
        <input type="number" id="hours" name="hours"
               min="0" max="24" placeholder="Наприклад, 3">
        <br><br>

        <label for="date">Дата початку гри:</label>
        <input type="date" id="date" name="date">
        <br><br>

        <label for="datetime">Дата та час ігрової сесії:</label>
        <input type="datetime-local" id="datetime" name="datetime">
        <br><br>

        <label for="month">Місяць народження:</label>
        <input type="month" id="month" name="month">
        <br><br>

        <label for="week">Тиждень турніру:</label>
        <input type="week" id="week" name="week">
        <br><br>

        <label for="time">Час гри:</label>
        <input type="time" id="time" name="time">
        <br><br>

        <label for="color">Улюблений колір:</label>
        <input type="color" id="color" name="color">
    </fieldset>

    <br>

    <fieldset>
        <legend>Ігровий досвід</legend>

        <label for="skill">Оціни свої навички (1–10):</label>
        <input type="range" id="skill" name="skill"
               min="1" max="10" value="5">
        <br><br>

        <label for="experience">Рівень досвіду:</label>
        <meter id="experience" min="0" max="100"
               value="65">65%</meter>
        <br><br>

        <label for="progress">Прогрес анкети:</label>
        <progress id="progress" value="80" max="100">80%</progress>
        <br><br>

        <p>Граєш у команді?</p>

        <input type="radio" id="yes" name="team" value="yes" required>
        <label for="yes">Так</label>

        <input type="radio" id="no" name="team" value="no">
        <label for="no">Ні</label>
        <br><br>

        <label for="review">Улюблена гра та чому вона подобається:</label>
        <br>
        <textarea id="review" name="review" rows="4" cols="40"
                  placeholder="Напишіть відгук..."
                  spellcheck="false"></textarea>
        <br><br>

        <label for="tag">Тег команди:</label>
        <input type="text" id="tag" name="tag"
               placeholder="TEAM123"
               pattern="[A-Z]{4}[0-9]{3}"
               title="Чотири великі літери та три цифри">
    </fieldset>

    <br>

    <input type="checkbox" id="agreement"
           name="agreement" required>
    <label for="agreement">Підтверджую правильність даних.</label>

    <br><br>

    <input type="submit" value="Надіслати">
    <input type="reset" value="Очистити">

</form>

</body>
</html>
